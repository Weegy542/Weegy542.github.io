<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCBE Geyser Tierlist</title>

    <!-- 🔒 SECURITY -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://weegy542.github.io;">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#000000',
                        tierGrey: '#444444',
                        textYellow: '#ffcc00',
                        textRed: '#ff0000',
                        border: '#222222'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg text-white min-h-screen font-sans">

<!-- 📍 1. GAMEMODES - ALL IN ONE LINE AT TOP -->
<div class="px-3 py-2 border-b border-border overflow-x-auto">
    <div class="flex flex-row gap-2">
        <button class="mode-btn bg-red-900 px-3 py-1 rounded text-sm hover:bg-red-800" data-mode="NethOP">NethOP</button>
        <button class="mode-btn bg-[#1a1a1a] px-3 py-1 rounded text-sm hover:bg-red-900" data-mode="DiaSMP">DiaSMP</button>
        <button class="mode-btn bg-[#1a1a1a] px-3 py-1 rounded text-sm hover:bg-red-900" data-mode="UHC">UHC</button>
        <button class="mode-btn bg-[#1a1a1a] px-3 py-1 rounded text-sm hover:bg-red-900" data-mode="SMP">SMP</button>
        <button class="mode-btn bg-[#1a1a1a] px-3 py-1 rounded text-sm hover:bg-red-900" data-mode="Axe">Axe</button>
        <button class="mode-btn bg-[#1a1a1a] px-3 py-1 rounded text-sm hover:bg-red-900" data-mode="Mace">Mace</button>
        <button class="mode-btn bg-[#1a1a1a] px-3 py-1 rounded text-sm hover:bg-red-900" data-mode="Crystal">Crystal</button>
        <button class="mode-btn bg-[#1a1a1a] px-3 py-1 rounded text-sm hover:bg-red-900" data-mode="DiaPot">DiaPot</button>
        <button class="mode-btn bg-[#1a1a1a] px-3 py-1 rounded text-sm hover:bg-red-900" data-mode="Sword">Sword</button>
    </div>
</div>

<!-- 📍 2. TITLE -->
<div class="px-3 py-3">
    <h1 class="text-xl font-bold">
        <span class="text-textYellow">MCBE Geyser</span>
        <span class="text-textRed"> Tierlist</span>
    </h1>
</div>

<!-- 📍 3. TIERS - STRAIGHT HORIZONTAL LINE -->
<div class="px-3 py-2 border-y border-border overflow-x-auto">
    <div class="flex flex-row gap-2">
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">LT5</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">HT5</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">LT4</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">HT4</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">LT3</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">HT3</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">LT2</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">HT2</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">LT1</div>
        <div class="bg-tierGrey text-white px-3 py-1.5 rounded font-medium text-sm min-w-[50px] text-center">HT1</div>
    </div>
</div>

<!-- 📍 4. SEARCH BAR -->
<div class="px-3 py-3 border-b border-border">
    <label class="text-gray-300 text-sm">Search:</label>
    <input type="text" id="searchInput" placeholder="Player name..." maxlength="32" class="ml-2 w-48 bg-[#111] border border-red-800 rounded px-2 py-1 text-sm text-white outline-none focus:ring-1 focus:ring-textYellow">
</div>

<!-- 📍 5. LEADERBOARD -->
<div class="px-3 py-3">
    <h2 class="text-base font-semibold text-textYellow mb-2">Leaderboard</h2>
    <div id="leaderboard" class="space-y-2 text-sm">Loading data...</div>
</div>

<!-- MODAL -->
<div id="tierModal" class="fixed inset-0 bg-black/95 z-50 hidden items-center justify-center p-3">
    <div class="bg-black w-full max-w-md rounded border border-red-800 p-4">
        <div class="flex justify-between items-center border-b border-red-800 pb-2 mb-3">
            <h3 id="modalTitle" class="font-bold text-textYellow"></h3>
            <button onclick="closeModal()" class="text-textRed text-lg">&times;</button>
        </div>
        <div id="modalPlayers" class="flex flex-wrap gap-1"></div>
    </div>
</div>

<!-- FOOTER -->
<div class="px-3 py-3 text-center text-xs text-gray-500 border-t border-border">
    MCBE Geyser Tierlist • Auto Updated
</div>

<script>
// 🔒 Sanitize to prevent hacks
function safe(str) {
    return String(str).replace(/[&<>"'`\/\\]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const tierOrder = ["LT5","HT5","LT4","HT4","LT3","HT3","LT2","HT2","LT1","HT1"];
let data = {};
let currentMode = "NethOP";

// Load data
async function loadData() {
    try {
        const res = await fetch("https://weegy542.github.io/data.json", {cache:"no-cache"});
        if(!res.ok) throw new Error();
        data = await res.json();
        renderBoard();
    } catch {
        document.getElementById("leaderboard").innerHTML = `<span class="text-red-500">Failed to load ❌</span>`;
    }
}

// Render leaderboard
function renderBoard() {
    const container = document.getElementById("leaderboard");
    container.innerHTML = "";
    const mode = data.modes?.[currentMode];
    if(!mode) { container.innerHTML = "No data available"; return; }

    tierOrder.forEach(tier => {
        const players = mode.tiers?.[tier]?.players || [];
        const safeTier = safe(tier);
        const safeNames = players.map(p => safe(p.displayName));

        const row = document.createElement("div");
        row.className = "flex items-center bg-[#0a0a0a] border border-red-900 rounded p-2 cursor-pointer hover:bg-[#120202]";
        row.innerHTML = `
            <div class="bg-tierGrey text-white font-bold w-12 text-center rounded py-1 mr-3">${safeTier}</div>
            <div class="flex flex-wrap gap-1">
                ${safeNames.length ? safeNames.map(n => `<span class="bg-[#1a1a1a] border border-red-800 rounded px-2 py-0.5 text-xs">${n}</span>`).join("") : `<span class="text-gray-500 italic">No players</span>`}
            </div>
        `;
        row.onclick = () => openModal(safeTier, safeNames);
        container.appendChild(row);
    });
}

function openModal(tier, players) {
    document.getElementById("modalTitle").textContent = `${tier} Players`;
    document.getElementById("modalPlayers").innerHTML = players.length ? players.map(n => `<span class="bg-[#1a1a1a] border border-red-800 rounded px-2 py-1 text-xs">${n}</span>`).join("") : `<span class="text-gray-400">No players</span>`;
    document.getElementById("tierModal").style.display = "flex";
}
function closeModal() {
    document.getElementById("tierModal").style.display = "none";
}

// Search
document.getElementById("searchInput").addEventListener("input", () => {
    const q = safe(document.getElementById("searchInput").value.toLowerCase().trim());
    document.querySelectorAll("#leaderboard span, #modalPlayers span").forEach(el => {
        el.classList.toggle("ring-1 ring-textYellow bg-red-900", el.textContent.toLowerCase().includes(q));
    });
});

// Gamemode switch
document.querySelectorAll(".mode-btn").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("bg-red-900"), b.classList.add("bg-[#1a1a1a]"));
    btn.classList.remove("bg-[#1a1a1a]"); btn.classList.add("bg-red-900");
    currentMode = btn.dataset.mode;
    renderBoard();
}));

window.onclick = e => e.target === document.getElementById("tierModal") && closeModal();

loadData();
setInterval(loadData, 600000);
</script>

</body>
</html>
