<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[MCBE] Geyser Tierlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .tier-1 { background: linear-gradient(90deg, #facc15, #eab308); color: black; }
    .tier-2 { background: linear-gradient(90deg, #a5b4fc, #6366f1); }
    .tier-3 { background: linear-gradient(90deg, #6ee7b7, #10b981); color: black; }
    .tier-4 { background: linear-gradient(90deg, #f87171, #ef4444); }
    .tier-5 { background: linear-gradient(90deg, #9ca3af, #6b7280); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-11 h-11 bg-gradient-to-br from-emerald-500 to-cyan-500 rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg">
          G
        </div>
        <div>
          <h1 class="text-3xl font-bold tracking-tighter">[MCBE] Geyser Tierlist</h1>
          <p class="text-emerald-400 text-sm -mt-1">Bedrock PvP Rankings • Powered by Geyser</p>
        </div>
      </div>

      <div class="flex gap-8 text-sm font-medium">
        <a href="#" onclick="switchTab(0)" class="nav-link active text-emerald-400">Overall</a>
        <a href="#" onclick="switchTab(1)" class="nav-link">Sword</a>
        <a href="#" onclick="switchTab(2)" class="nav-link">Axe</a>
        <a href="#" onclick="switchTab(3)" class="nav-link">PotPvP</a>
        <a href="#" onclick="switchTab(4)" class="nav-link">Crystal</a>
        <a href="#" onclick="switchTab(5)" class="nav-link">UHC</a>
      </div>

      <input id="search" type="text" placeholder="Search players..." 
             class="bg-zinc-800 border border-zinc-700 rounded-full px-5 py-3 text-sm focus:outline-none focus:border-emerald-500 w-80 placeholder-zinc-500">
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-10">
    <h2 id="page-title" class="text-4xl font-bold mb-8">Overall Rankings</h2>

    <div class="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
      <table class="w-full">
        <thead>
          <tr class="border-b border-zinc-800 text-left text-zinc-400 text-sm uppercase tracking-wider">
            <th class="px-8 py-6 w-12">#</th>
            <th class="px-6 py-6">Player</th>
            <th class="px-6 py-6">Tier Points</th>
            <th class="px-6 py-6">Overall</th>
            <th class="px-6 py-6">Sword</th>
            <th class="px-6 py-6">Axe</th>
            <th class="px-6 py-6">PotPvP</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body" class="text-sm"></tbody>
      </table>
    </div>

    <p class="text-center text-zinc-500 text-xs mt-8">Last updated: Just now • Data from GeyserMC Bedrock community</p>
  </div>

  <script>
    const players = [
      { rank: 1, name: "GeyserKing", points: 245, overall: "HT1", sword: "HT1", axe: "HT2", pot: "HT1" },
      { rank: 2, name: "BedrockGod", points: 228, overall: "LT1", sword: "LT2", axe: "HT1", pot: "HT1" },
      { rank: 3, name: "MCBEProX", points: 201, overall: "LT2", sword: "HT2", axe: "HT1", pot: "LT2" },
      { rank: 4, name: "SwampSniper", points: 187, overall: "HT2", sword: "LT2", axe: "HT2", pot: "HT3" },
      { rank: 5, name: "PixelWarrior", points: 165, overall: "LT2", sword: "HT3", axe: "LT1", pot: "HT2" },
      { rank: 6, name: "EnderSlayer", points: 152, overall: "HT3", sword: "HT2", axe: "LT2", pot: "LT1" },
    ];

    function getTierClass(tier) {
      if (tier.includes('HT1')) return 'tier-1 px-4 py-1 rounded-xl text-xs font-bold';
      if (tier.includes('HT2')) return 'tier-2 px-4 py-1 rounded-xl text-xs font-bold';
      if (tier.includes('HT3')) return 'tier-3 px-4 py-1 rounded-xl text-xs font-bold';
      return 'tier-4 px-4 py-1 rounded-xl text-xs font-bold';
    }

    function renderLeaderboard(data) {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      data.forEach(player => {
        const row = document.createElement('tr');
        row.className = "border-b border-zinc-800 hover:bg-zinc-800/70 transition-all duration-200";
        row.innerHTML = `
          <td class="px-8 py-6 font-mono text-zinc-400">#${player.rank}</td>
          <td class="px-6 py-6 font-semibold">${player.name}</td>
          <td class="px-6 py-6 text-emerald-400 font-bold">${player.points}</td>
          <td class="px-6 py-6"><span class="${getTierClass(player.overall)}">${player.overall}</span></td>
          <td class="px-6 py-6"><span class="${getTierClass(player.sword)}">${player.sword}</span></td>
          <td class="px-6 py-6"><span class="${getTierClass(player.axe)}">${player.axe}</span></td>
          <td class="px-6 py-6"><span class="${getTierClass(player.pot)}">${player.pot}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    function switchTab(tabIndex) {
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active', 'text-emerald-400'));
      document.querySelectorAll('.nav-link')[tabIndex].classList.add('active', 'text-emerald-400');
      
      const titles = ["Overall Rankings", "Sword Rankings", "Axe Rankings", "PotPvP Rankings", "Crystal Rankings", "UHC Rankings"];
      document.getElementById('page-title').textContent = titles[tabIndex];
      renderLeaderboard(players);
    }

    // Search functionality
    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = players.filter(p => p.name.toLowerCase().includes(term));
      renderLeaderboard(filtered);
    });

    // Initial render
    renderLeaderboard(players);
  </script>
</body>
</html>
