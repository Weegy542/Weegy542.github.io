    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0E0E12',
                        darker: '#08080A',
                        primary: '#3498DB',
                        tier5: '#FF5555',
                        tier4: '#FFAA00',
                        tier3: '#FFFF55',
                        tier2: '#55FF55',
                        tier1: '#5599FF'
                    },
                    fontFamily: {
                        minecraft: ['Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .tier-row {
                @apply flex flex-wrap md:flex-nowrap items-center rounded-md mb-3 overflow-hidden border border-gray-700 cursor-pointer transition hover:brightness-110;
            }
            .tier-label {
                @apply w-28 h-16 flex items-center justify-center font-bold text-lg shrink-0;
            }
            .player-card {
                @apply bg-gray-800 hover:bg-gray-700 rounded px-3 py-1.5 m-1 text-sm transition-colors;
            }
            .modal {
                @apply fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden;
            }
            .modal-content {
                @apply bg-dark rounded-lg w-full max-w-2xl max-h-[80vh] overflow-auto border border-gray-700;
            }
        }
    </style>
</head>
<body class="bg-darker text-gray-100 min-h-screen font-minecraft">

<!-- Header -->
<header class="bg-dark border-b border-gray-800 py-5">

        <button class="gamemode-btn bg-gray-800 px-3 py-2 rounded hover:bg-gray-700 transition text-sm" data-mode="Mace">Mace</button>
        <button class="gamemode-btn bg-gray-800 px-3 py-2 rounded hover:bg-gray-700 transition text-sm" data-mode="Crystal">Crystal</button>
        <button class="gamemode-btn bg-gray-800 px-3 py-2 rounded hover:bg-gray-700 transition text-sm" data-mode="DiaPot">DiaPot</button>
        <button class="gamemode-btn bg-gray-800 px-3 py-2 rounded hover:bg-gray-700 transition text-sm" data-mode="Sword">Sword</button>
    </div>

    <!-- Info Bar -->
    <div class="mb-4 flex flex-wrap justify-between items-center text-gray-300 text-sm">
        <span>Last Updated: <span id="last-updated">Loading...</span></span>
        <span>Points: LT5=1 | HT5=2 | LT4=3 | HT4=4 | LT3=6 | HT3=10 | LT2=20 | HT2=30 | LT1=45 | HT1=60</span>
    </div>

    <!-- Leaderboard Section -->
    <div id="leaderboard-container" class="space-y-3">
        Loading ranks...
    </div>

</div>

<!-- Clickable Tier Popup -->
<div id="tier-modal" class="modal">
    <div class="modal-content p-5">
        <div class="flex justify-between items-center border-b border-gray-700 pb-3 mb-4">
            <h3 id="modal-title" class="text-xl font-bold"></h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
        </div>
        <div id="modal-players" class="flex flex-wrap gap-3"></div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark border-t border-gray-800 py-4 text-center text-gray-500 text-sm">
    © 2026 MCBE Geyser Tierlist • Updated automatically via Discord Bot
</footer>
