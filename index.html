<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCBE Geyser Tierlist</title>
    <style>
        :root {
            --primary: #385E8B;
            --accent: #48B518;
            --dark: #452E3F;
            --light: #f8f9fa;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            min-height: 100vh;
            color: var(--white);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border-bottom: 4px solid var(--accent);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .updated {
            color: var(--accent);
            font-weight: 500;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .mode-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 1.5rem;
            border-left: 5px solid var(--accent);
            backdrop-filter: blur(6px);
        }

        .mode-title {
            color: var(--accent);
            font-size: 1.4rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tier {
            margin: 1rem 0;
            padding: 0.8rem;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
        }

        .tier-name {
            font-weight: bold;
            color: var(--white);
            margin-bottom: 0.4rem;
        }

        .players {
            list-style: none;
            color: #e0e0e0;
            font-size: 0.95rem;
        }

        .no-players {
            color: #b0b0b0;
            font-style: italic;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GEYSER TIER LIST</h1>
            <p class="updated">Last Updated: <span id="lastUpdated">Loading...</span></p>
        </header>

        <div class="modes-grid" id="modesContainer">
            <p style="text-align:center; grid-column: 1 / -1; font-size:1.2rem;">Loading tier list data...</p>
        </div>

        <footer>
            <p>© Geyser Tier System | Colors: #385E8B • #48B518 • #452E3F</p>
        </footer>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                document.getElementById('lastUpdated').textContent = new Date(data.lastUpdated).toLocaleString();
                const container = document.getElementById('modesContainer');
                container.innerHTML = '';

                for (const [modeName, modeData] of Object.entries(data.modes)) {
                    const card = document.createElement('div');
                    card.className = 'mode-card';
                    card.innerHTML = `<h2 class="mode-title">${modeName}</h2>`;

                    for (const tier of ["LT5","HT5","LT4","HT4","LT3","HT3","LT2","HT2","LT1","HT1"]) {
                        const tierData = modeData.tiers[tier];
                        const playersList = tierData.players.length 
                            ? tierData.players.map(p => `<li>• ${p.name}</li>`).join('')
                            : `<li class="no-players">No players</li>`;

                        card.innerHTML += `
                            <div class="tier">
                                <div class="tier-name">${tier}</div>
                                <ul class="players">${playersList}</ul>
                            </div>
                        `;
                    }

                    container.appendChild(card);
                }

            } catch (err) {
                document.getElementById('modesContainer').innerHTML = `
                    <p style="text-align:center; color:#ffcccc; grid-column: 1 / -1;">
                        ❌ Could not load data. Please wait a moment and refresh.
                    </p>
                `;
            }
        }

        loadData();
        setInterval(loadData, 60000); // refresh every 1 minute
    </script>
</body>
</html>
