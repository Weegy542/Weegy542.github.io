<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MCBE Geyser Tierlist</title>

    <!-- 🔒 SECURITY -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://weegy542.github.io;">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#000000',
                        bgGlow: '#121212',
                        tierGrey: '#444444',
                        redGlow: '#ff0000',
                        borderGlow: '#2a2a2a'
                    },
                    fontFamily: {
                        mc: ['"Minecraft"', '"Press Start 2P"', 'monospace', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glow-bg {
                background: radial-gradient(circle at top, #222222 0%, #000000 70%);
            }
            .mode-glow {
                box-shadow: 0 0 6px #ff000080, 0 0 12px #ff000040;
            }
            .title-glow {
                text-shadow: 0 0 4px #ff0000, 0 0 8px #ff0000, 0 0 12px #ff0000;
            }
            .tier-glow {
                box-shadow: 0 0 4px #88888870;
            }
            .search-glow {
                box-shadow: 0 0 5px #ff000090;
            }
            .player-glow {
                box-shadow: 0 0 3px #44444460;
            }
        }
    </style>
</head>
<body class="bg-bgMain text-white font-mc min-h-screen glow-bg">

<!-- 📍 SEARCH BAR - TOP LEFT -->
<div class="fixed top-2 left-2 z-50 w-[calc(100%-16px)]">
    <input type="text" id="searchInput" placeholder="Search..." maxlength="32" class="w-full bg-black border border-redGlow rounded py-1.5 px-3 text-sm text-white outline-none search-glow">
</div>
<div class="h-12"></div> <!-- Spacer for fixed search -->

<!-- 📍 GAMEMODES - VERY TOP, STRAIGHT LINE, GLOW -->
<div class="px-2 py-3 overflow-x-auto">
    <div class="flex flex-row gap-2">
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="NethOP">NethOP</button>
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="DiaSMP">DiaSMP</button>
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="UHC">UHC</button>
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="SMP">SMP</button>
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="Axe">Axe</button>
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="Mace">Mace</button>
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="Crystal">Crystal</button>
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="DiaPot">DiaPot</button>
        <button class="mode-btn bg-[#181818] text-white px-3 py-1.5 rounded text-xs whitespace-nowrap mode-glow hover:bg-red-900" data-mode="Sword">Sword</button>
    </div>
</div>

<!-- 📍 TITLE - BELOW GAMEMODES, RED GLOW -->
<div class="px-3 py-2">
    <h1 class="text-lg font-bold text-black title-glow">MCBE Geyser Tierlist</h1>
</div>

<!-- 📍 TIERS - STRAIGHT LINE, GREY + GLOW -->
<div class="px-2 py-3 overflow-x-auto border-y border-borderGlow">
    <div class="flex flex-row gap-2">
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">LT5</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">HT5</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">LT4</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">HT4</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">LT3</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">HT3</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">LT2</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">HT2</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">LT1</div>
        <div class="bg-tierGrey text-black font-bold px-3 py-1.5 rounded text-sm min-w-[55px] text-center tier-glow">HT1</div>
    </div>
</div>

<!-- 📍 TIER LIST -->
<div class="px-2 py-3">
    <div id="leaderboard" class="space-y-3 text-sm"></div>
</div>

<!-- MODAL -->
<div id="tierModal" class="fixed inset-0 bg-black/90 z-40 hidden items-center justify-center p-3">
    <div class="bg-[#0a0a0a] w-full max-w-sm rounded border border-redGlow p-4 shadow-lg shadow-redGlow/30">
        <div class="flex justify-between items-center border-b border-redGlow/50 pb-2 mb-3">
            <h3 id="modalTitle" class="text-base font-bold text-black title-glow"></h3>
            <button onclick="closeModal()" class="text-redGlow text-xl font-bold">&times;</button>
        </div>
        <div id="modalPlayers" class="flex flex-wrap gap-2"></div>
    </div>
</div>

<!-- FOOTER -->
<div class="px-3 py-3 text-center text-xs text-gray-500 mt-2">
    MCBE Geyser Tierlist • Auto Updated
</div>

<script>
// 🔒 Secure sanitize
function safe(str) {
    return String(str).replace(/[&<>"'`\/\\]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const tierOrder = ["LT5","HT5","LT4","HT4","LT3","HT3","LT2","HT2","LT1","HT1"];
let data = {};
let currentMode = "NethOP";

async function loadData() {
    try {
        const res = await fetch("https://weegy542.github.io/data.json", {cache:"no-cache"});
        if(!res.ok) throw new Error();
        data = await res.json();
        renderBoard();
    } catch {
        document.getElementById("leaderboard").innerHTML = `<div class="text-red-500 p-2 text-center">Failed to load ❌</div>`;
    }
}

function renderBoard() {
    const container = document.getElementById("leaderboard");
    container.innerHTML = "";
    const mode = data.modes?.[currentMode];
    if(!mode) { container.innerHTML = `<div class="text-gray-400 p-2 text-center">No data available</div>`; return; }

    tierOrder.forEach(tier => {
        const players = mode.tiers?.[tier]?.players || [];
        const safeTier = safe(tier);
        const safeNames = players.map(p => safe(p.displayName));

        const row = document.createElement("div");
        row.className = "flex items-center bg-[#080808] border border-gray-700 rounded p-2 cursor-pointer hover:bg-[#100505]";
        row.innerHTML = `
            <div class="bg-tierGrey text-black font-bold w-14 text-center rounded py-1 mr-2 tier-glow">${safeTier}</div>
            <div class="flex flex-wrap gap-1 flex-1">
                ${safeNames.length ? safeNames.map(n => `<span class="bg-[#181818] text-white rounded px-2 py-0.5 text-xs player-glow">${n}</span>`).join("") : `<span class="text-gray-500 italic text-xs">No players</span>`}
            </div>
        `;
        row.onclick = () => openModal(safeTier, safeNames);
        container.appendChild(row);
    });
}

function openModal(tier, players) {
    document.getElementById("modalTitle").textContent = tier;
    document.getElementById("modalPlayers").innerHTML = players.length ? players.map(n => `<span class="bg-[#222] text-white rounded px-2 py-1 text-xs player-glow">${n}</span>`).join("") : `<span class="text-gray-400">No players</span>`;
    document.getElementById("tierModal").style.display = "flex";
}
function closeModal() {
    document.getElementById("tierModal").style.display = "none";
}

// Search function
document.getElementById("searchInput").addEventListener("input", () => {
    const q = safe(document.getElementById("searchInput").value.toLowerCase().trim());
    document.querySelectorAll(".player-glow").forEach(el => {
        el.classList.toggle("bg-red-900 ring-1 ring-yellow-400", el.textContent.toLowerCase().includes(q));
    });
});

// Gamemode switch
document.querySelectorAll(".mode-btn").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("bg-red-900"));
    btn.classList.add("bg-red-900");
    currentMode = btn.dataset.mode;
    renderBoard();
}));

window.onclick = e => { if(e.target === document.getElementById("tierModal")) closeModal(); };

loadData();
setInterval(loadData, 600000);
</script>

</body>
</html>
