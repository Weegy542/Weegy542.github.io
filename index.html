<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MCBE Geyser Tierlist</title>

    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://weegy542.github.io;">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#452E3F',
                        primary: '#385E8B',
                        accent: '#48B518',
                        tierGrey: '#444444',
                        gold: '#ffd700',
                        silver: '#c0c0c0',
                        bronze: '#cd7f32'
                    },
                    fontFamily: {
                        mc: ['"Minecraft"', 'monospace', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glow-bg { background: radial-gradient(circle at top, #2c1e29 0%, #452E3F 70%); }
            .mode-glow { box-shadow: 0 0 6px #48B51880, 0 0 12px #48B51840; }
            .title-glow { text-shadow: 0 0 4px #48B518, 0 0 8px #385E8B; }
            .tier-tag { background: #385E8B; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; box-shadow: 0 0 3px #385E8B70; color: white; }
            .search-glow { box-shadow: 0 0 5px #48B51890; }
            .rank-1 { color: #ffd700; font-weight: bold; text-shadow: 0 0 3px #ffd70080; }
            .rank-2 { color: #c0c0c0; font-weight: bold; text-shadow: 0 0 3px #c0c0c080; }
            .rank-3 { color: #cd7f32; font-weight: bold; text-shadow: 0 0 3px #cd7f3280; }
        }
    </style>
</head>
<body class="bg-bgMain text-white font-mc min-h-screen glow-bg">

<!-- 🔍 SEARCH BAR -->
<div class="fixed top-2 left-2 z-50 w-[calc(100%-16px)]">
    <input type="text" id="searchInput" placeholder="Search IGN..." maxlength="32" class="w-full bg-[#2b1d28] border border-accent rounded py-2 px-3 text-base text-white outline-none search-glow">
</div>
<div class="h-16"></div>

<!-- 🎮 GAMEMODES - CRYSTAL REMOVED -->
<div class="px-2 py-3 overflow-x-auto">
    <div class="flex flex-row gap-2">
        <button class="mode-btn bg-primary px-3 py-2 rounded text-sm whitespace-nowrap mode-glow" data-mode="NethOP">NethOP</button>
        <button class="mode-btn bg-[#2b1d28] px-3 py-2 rounded text-sm whitespace-nowrap mode-glow hover:bg-primary" data-mode="DiaSMP">DiaSMP</button>
        <button class="mode-btn bg-[#2b1d28] px-3 py-2 rounded text-sm whitespace-nowrap mode-glow hover:bg-primary" data-mode="UHC">UHC</button>
        <button class="mode-btn bg-[#2b1d28] px-3 py-2 rounded text-sm whitespace-nowrap mode-glow hover:bg-primary" data-mode="SMP">SMP</button>
        <button class="mode-btn bg-[#2b1d28] px-3 py-2 rounded text-sm whitespace-nowrap mode-glow hover:bg-primary" data-mode="Axe">Axe</button>
        <button class="mode-btn bg-[#2b1d28] px-3 py-2 rounded text-sm whitespace-nowrap mode-glow hover:bg-primary" data-mode="Mace">Mace</button>
        <button class="mode-btn bg-[#2b1d28] px-3 py-2 rounded text-sm whitespace-nowrap mode-glow hover:bg-primary" data-mode="DiaPot">DiaPot</button>
        <button class="mode-btn bg-[#2b1d28] px-3 py-2 rounded text-sm whitespace-nowrap mode-glow hover:bg-primary" data-mode="Sword">Sword</button>
    </div>
</div>

<!-- 📝 TITLE -->
<div class="px-3 py-3 text-center">
    <h1 class="text-xl font-bold text-white title-glow">MCBE Geyser Tierlist</h1>
</div>

<!-- 🏆 LEADERBOARD -->
<div class="px-3 py-4">
    <div id="leaderboard" class="space-y-3 text-base"></div>
</div>

<script>
function safe(str) {
    return String(str).replace(/[&<>"'`\/\\]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const tierOrder = ["LT5","HT5","LT4","HT4","LT3","HT3","LT2","HT2","LT1","HT1"];
let data = {};
let currentMode = "NethOP";

async function loadData() {
    try {
        const res = await fetch("https://weegy542.github.io/data.json", {cache:"no-cache"});
        if(!res.ok) throw new Error();
        data = await res.json();
        renderBoard();
    } catch {
        document.getElementById("leaderboard").innerHTML = `<div class="text-accent p-3 text-center">Failed to load ❌</div>`;
    }
}

function renderBoard() {
    const container = document.getElementById("leaderboard");
    container.innerHTML = "";
    const mode = data.modes?.[currentMode];
    if(!mode) { container.innerHTML = `<div class="text-gray-300 p-3 text-center">No data available</div>`; return; }

    const allPlayers = [];
    tierOrder.forEach(tier => {
        const players = mode.tiers?.[tier]?.players || [];
        players.forEach(p => {
            allPlayers.push({ ign: safe(p.ign || p.displayName || p.name), tier: safe(tier) });
        });
    });

    if(allPlayers.length === 0) {
        container.innerHTML = `<div class="text-gray-300 italic text-center py-4">No players in this gamemode</div>`;
        return;
    }

    allPlayers.forEach((player, index) => {
        const rank = index + 1;
        let rankClass = "";
        if(rank === 1) rankClass = "rank-1";
        else if(rank === 2) rankClass = "rank-2";
        else if(rank === 3) rankClass = "rank-3";
        else rankClass = "text-white";

        const div = document.createElement("div");
        div.className = "bg-[#2b1d28] border border-primary rounded p-3 flex items-center justify-between hover:border-accent transition-all";
        div.innerHTML = `<span class="${rankClass}">#${rank} ${player.ign}</span><span class="tier-tag font-bold">${player.tier}</span>`;
        container.appendChild(div);
    });
}

document.querySelectorAll(".mode-btn").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => { 
        b.classList.remove("bg-primary"); 
        b.classList.add("bg-[#2b1d28]"); 
    });
    btn.classList.remove("bg-[#2b1d28]"); 
    btn.classList.add("bg-primary");
    currentMode = btn.dataset.mode;
    renderBoard();
}));

document.getElementById("searchInput").addEventListener("input", () => {
    const q = safe(document.getElementById("searchInput").value.toLowerCase().trim());
    document.querySelectorAll("#leaderboard div").forEach(el => 
        el.classList.toggle("ring-1 ring-accent", el.textContent.toLowerCase().includes(q))
    );
});

loadData();
setInterval(loadData, 600000);
</script>
</body>
</html>
